<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Copilot Control Room</title><desc id="desc">La carga terminó. Los tests pasan. ¿Lo aprobarías?</desc><rect width="1200" height="360" rx="22" fill="#0c1525"/><rect x="40" y="40" width="5" height="280" fill="#5ae1c3"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="80" y="95" fill="#5ae1c3" font-size="19" letter-spacing="4">LIVE AGENT WORKSHOP</text><text x="76" y="175" fill="#ffffff" font-size="61" font-weight="700">Copilot Control Room</text><text x="80" y="225" fill="#bacbdf" font-size="26">La carga terminó. Los tests pasan. ¿Lo aprobarías?</text><rect x="80" y="265" width="235" height="43" rx="8" fill="#193d37"/><text x="97" y="294" fill="#6ee7b7" font-size="18">LEGACY TESTS: PASS</text><rect x="335" y="265" width="275" height="43" rx="8" fill="#492333"/><text x="352" y="294" fill="#fda4af" font-size="18">BUSINESS CHECKS: FAIL</text></g></svg>
